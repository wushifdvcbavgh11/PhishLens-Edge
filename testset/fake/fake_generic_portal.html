<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【本地演示】员工门户 - 登录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#eef1f5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { width:400px; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:40px 42px; }
  .brand { text-align:center; margin-bottom:10px; }
  .brand .logo { width:56px; height:56px; margin:0 auto; border-radius:50%; background:linear-gradient(135deg,#4a7bff,#6a5cff); color:#fff; font-size:26px; font-weight:700; line-height:56px; }
  .brand h1 { font-size:20px; color:#202124; margin-top:12px; font-weight:600; }
  .brand p { font-size:13px; color:#8a8f99; margin-top:6px; }
  label { display:block; font-size:13px; color:#333; margin:14px 0 6px; }
  input { width:100%; height:44px; border:1px solid #d9dde3; border-radius:8px; padding:0 14px; font-size:14px; outline:none; }
  input:focus { border-color:#4a7bff; box-shadow:0 0 0 2px #4a7bff22; }
  button { width:100%; height:46px; border:none; border-radius:8px; background:#4a7bff; color:#fff; font-size:15px; font-weight:600; margin-top:24px; cursor:pointer; }
  .foot { text-align:center; font-size:12px; color:#9aa0aa; margin-top:26px; padding-top:16px; border-top:1px solid #eef0f3; }
</style>

<meta http-equiv="Content-Security-Policy" content="form-action 'none'; base-uri 'none'; object-src 'none'">
<style>
  body { padding-top:110px !important; }
  .local-demo-banner { position:fixed; top:0; left:0; right:0; z-index:2147483646;
    padding:12px 18px; background:#fff3cd; color:#4f3200; border-bottom:3px solid #bf7000;
    text-align:center; font:700 16px/1.6 'Microsoft YaHei',sans-serif; }
  .local-demo-banner small { display:block; font-size:13px; font-weight:400; }
  .local-demo-status { margin-top:16px; padding:12px; border:2px solid #bf7000;
    color:#4f3200; background:#fff3cd; font:14px/1.6 'Microsoft YaHei',sans-serif; }
</style>
<script id="local-demo-submit-guard">
  'use strict';
  document.addEventListener('submit', function (event) {
    event.preventDefault();
    var status = document.getElementById('local-demo-status');
    status.hidden = false;
    status.textContent = '本地演示：已阻止提交，没有发送账号、密码或验证码。请勿使用真实信息。';
  }, true);
</script>
</head>
<body>
<aside id="local-demo-banner" class="local-demo-banner" role="note">
  本地演示 / 请勿输入真实账号密码
  <small>仅用于防御检测演示，不提供登录服务；表单不会发送输入内容。</small>
</aside>
<noscript><p class="local-demo-status">本地演示：脚本未运行，浏览器提交策略仍禁止表单发送。</p></noscript>

<div class="card">
  <div class="brand">
    <div class="logo">员</div>
    <h1>员工统一门户</h1>
    <p>欢迎回来，请输入您的账号信息</p>
  </div>
  <form id="loginForm" action="#" method="post" autocomplete="off">
    <label for="account">账号</label>
    <input id="account" type="text" placeholder="请输入工号或邮箱" autocomplete="off">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码" autocomplete="off">
    <button type="submit">演示提交（不会登录）</button>
  </form><p id="local-demo-status" class="local-demo-status" role="status" hidden></p>
  <div class="foot">Copyright &copy; 2026 员工门户</div>
</div>
</body>
</html>
